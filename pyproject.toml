[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ussync"
version = "0.1.0"
description = "Biblioteca universitaria local: Enseñanza Virtual y SEVIUS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "rich>=13,<15",
  "questionary>=2,<3", "python-dotenv>=1,<2", "filelock>=3,<4",
  "playwright>=1.51,<2",
  "fastapi>=0.110,<1", "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
ussync = "ussync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ussync = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
