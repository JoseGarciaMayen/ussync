name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.USSYNC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "Missing USSYNC_RELEASE_KEYSTORE_BASE64 repository secret" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ussync-release.jks"
          chmod 600 "$RUNNER_TEMP/ussync-release.jks"

      - name: Build Release APK
        env:
          USSYNC_RELEASE_STORE_FILE: ${{ runner.temp }}/ussync-release.jks
          USSYNC_RELEASE_STORE_PASSWORD: ${{ secrets.USSYNC_RELEASE_STORE_PASSWORD }}
          USSYNC_RELEASE_KEY_ALIAS: ${{ secrets.USSYNC_RELEASE_KEY_ALIAS }}
          USSYNC_RELEASE_KEY_PASSWORD: ${{ secrets.USSYNC_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk USSync.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: USSync.apk
          generate_release_notes: true
